[package]
name = "kero_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "1.42", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4", features = ["serde"] }

# Optional dependencies used only on specific targets
reqwest = { version = "0.11", features = ["json"] }  # removed optional flag so it is available for native builds
gloo-net = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Response"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.4"

[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
